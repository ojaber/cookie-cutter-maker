name: cookie-cutter-maker

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PIPELINE_OUTPUT_DIR: /app/output
      # Optional: require a passphrase to access the app
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      # Required for stable sessions when ACCESS_PASSWORD is set
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Optional: enable prompt->outline generation
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Public-instance guards (set to 0 to disable either one)
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      HEAVY_CONCURRENCY: ${HEAVY_CONCURRENCY:-2}
    volumes:
      - ./output:/app/output
      - ./examples:/app/examples
